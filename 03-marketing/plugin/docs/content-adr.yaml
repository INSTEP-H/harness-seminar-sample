- id: ADR-001
  title: 이모지 미사용
  status: adopted
  date: 2026-02-01
  channels: [all]
  context: |
    초기 SNS 운영 시 이모지를 적극 활용했으나, 도발형 톤과의 부조화가 잦았다.
    "AI 시대에 살아남으려면 ✨ 무엇을 해야 할까요? 🤔" 같은 표현이 메시지를 약하게 만들었고,
    경쟁사 콘텐츠와의 차별점이 흐려졌다. 또한 이모지 렌더링이 채널·플랫폼별로 달라
    기획 의도와 다른 인상을 주는 사례가 분기별로 반복됐다.
  decision: 모든 채널에서 이모지를 사용하지 않는다. 사람 손으로 추가하는 경우도 금지.
  consequence: review 단계에서 이모지 검출 시 자동 FAIL. 시그니처 표현으로 메시지를 강화한다.

- id: ADR-002
  title: 후크 우선 구조
  status: adopted
  date: 2026-02-12
  channels: [all]
  context: |
    SNS 알고리즘은 첫 1-2초의 시선 점유율을 핵심 지표로 사용한다.
    초기에는 도입부에 배경 설명을 두고 본론으로 들어가는 구조를 사용했으나,
    Threads/Instagram에서 "더 보기" 미클릭률이 70%를 넘는 것을 확인했다.
    또한 X의 280자 제한 안에서 후크가 늦게 나오면 본론까지 닿지 못하는 문제도 있었다.
  decision: 모든 채널의 본문 첫 줄은 도발형 후크여야 한다. 인사·자기소개·배경 설명을 첫 줄에 두지 않는다.
  consequence: format 단계에서 첫 줄 점검 자동화. review에서 후크 부재 시 FAIL.

- id: ADR-003
  title: CTA 위치 통일
  status: adopted
  date: 2026-03-04
  channels: [all]
  context: |
    초기에는 본문 중간·끝·이미지 위 등 다양한 위치에 CTA를 배치했다.
    A/B 테스트 결과 본문 끝(마지막 단락) CTA가 클릭률·문의 전환율 모두 가장 높았고,
    중간 CTA는 본문 흐름을 끊어 읽기 이탈을 유발했다.
  decision: CTA는 본문 마지막 단락에만 배치한다. 첫 줄 또는 중간 배치 금지.
  consequence: format/review 단계에서 CTA 위치 자동 검증.

- id: ADR-004
  title: 브랜드명 표기 통일
  status: adopted
  date: 2026-03-18
  channels: [all]
  context: |
    팀 내·외부에서 '바마클', '바이브 마피아', 'Vibe Mafia' 등 다양한 변형이 혼용되었다.
    검색 노출과 인지도 추적 시 동일 브랜드로 집계되지 않아 데이터가 분산됐고,
    공식 톤과 결이 다른 줄임말이 캐주얼한 인상을 강하게 남겼다.
  decision: 공식 표기는 '바이브마피아클럽', 'VIBE MAFIA CLUB', 'VMC' 세 가지만 사용한다. 줄임말·변형 금지.
  consequence: review에서 비공식 표기 자동 검출 → FAIL.
