- id: ADR-001
  title: 단일 프레임 템플릿(Pick-a-Card) 표준화
  status: adopted
  date: 2026-04-02
  channels: [reels]
  context: |
    초기에는 매 발행마다 다른 시퀀스 구성을 시도했다. 어떤 영상은 카드 5장,
    다른 영상은 3장, 어떤 영상은 처음부터 해석부터 보여주는 등 일관성이 없어
    팔로워가 채널의 콘텐츠 흐름을 학습하지 못했다.
    또한 매번 프레임 구성을 새로 설계하느라 작가/마케터의 작업 시간이 영상당 30분 이상 소요됐다.
  decision: 모든 reels는 4프레임 Pick-a-Card 템플릿(hook → selection → reveal → CTA)을 따른다. 변형은 별도 템플릿으로 등록 후 사용한다.
  consequence: format 단계에서 프레임 수·역할 자동 검증. 다른 시퀀스를 쓰려면 reels-templates.yaml에 추가 등록 필요.

- id: ADR-002
  title: 광고 직설 금지·댓글/DM 트리거 사용
  status: adopted
  date: 2026-04-09
  channels: [all]
  context: |
    초기에는 마지막 프레임에 "지금 가입하세요!" 같은 직접 가입 유도 카피를 넣었다.
    그러나 인스타 알고리즘 노출이 광고성 컨텐츠로 분류되어 도달이 떨어졌고,
    감성 서사 톤과의 부조화로 댓글 호응도 함께 하락했다.
    A/B 결과 "댓글 남겨주시면 해석 보내드려요" 트리거가 가입 전환·도달 모두에서 우위였다.
  decision: 마지막 프레임 CTA는 댓글 또는 DM 행동 유도만 허용한다. 가입·결제 직설 금지.
  consequence: review에서 광고 직설 표현 자동 검출 → FAIL.

- id: ADR-003
  title: 이모지 미사용 · 느낌표 최소화
  status: adopted
  date: 2026-04-12
  channels: [all]
  context: |
    감성 서사 톤은 정적인 호흡으로 읽혔을 때 가장 잘 전달된다.
    초기 운영 시 이모지·느낌표를 활용했으나, 점쟁이 클리셰("운명입니다 ✨")에 가깝게 읽혀
    "다정한 해석가" 페르소나에서 이탈하는 경우가 잦았다.
    또한 캡션 미리보기 첫 125자에서 이모지가 시선을 분산시켜 후크 효과가 약화됐다.
  decision: 모든 채널에서 이모지를 사용하지 않는다. 느낌표는 본문 전체에서 1개 이하로 제한한다.
  consequence: review에서 이모지 검출 시 FAIL, 느낌표 2개 이상이면 FAIL.

- id: ADR-004
  title: 주제 중복 회피 · 30일 쿨다운
  status: adopted
  date: 2026-04-18
  channels: [reels, instagram]
  context: |
    매일 발행 페이스에서 동일한 주제(예: "요즘 나를 좋아하는 사람")가 한 달 안에 여러 번 반복되는 경우
    팔로워 피로도가 빠르게 상승하고, 댓글·DM 전환률이 30% 이상 하락하는 패턴이 관찰됐다.
    또한 알고리즘이 동일 주제 반복을 "low-novelty"로 분류해 도달이 줄어드는 사례가 있었다.
  decision: 동일 주제(topic_id 기준)는 직전 30일 내 재사용 금지. pick-topic 단계에서 topic-history.yaml로 자동 필터링한다.
  consequence: pick-topic이 후보를 자동 제외. 사용자가 강제로 동일 주제를 골라야 하는 경우 명시적 override가 필요.

- id: ADR-005
  title: 로고 상단 고정 · 브랜드 비주얼 통일
  status: adopted
  date: 2026-04-25
  channels: [reels]
  context: |
    초기 reels에서 로고 위치를 프레임마다 다르게 배치(상단 좌/우/중앙, 일부는 미삽입)했더니
    채널 인지도 측정에서 노출량 대비 브랜드 회상률이 낮게 나왔다.
    또한 기기에 따라 로고가 인스타 UI(상단 핸들·하단 캡션 영역)에 가려지는 사례가 발생했다.
  decision: 로고는 상단 중앙, safe_zone 내부에 항상 배치한다. 모든 프레임에 동일 위치·동일 크기로 합성한다.
  consequence: frame-composer가 자동 합성. review가 로고 부재 또는 safe_zone 침범 시 FAIL.
