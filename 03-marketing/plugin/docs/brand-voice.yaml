brand:
  name_canonical: DAILY TAROT
  name_aliases: [데일리타로]
  description: |
    가상의 운세(타로/사주) 컨텐츠 브랜드. 매일 한 가지 주제로 "Pick-a-Card" 릴스를 발행한다.
    독자가 직관적으로 카드 한 장을 고르면, 그에 맞는 감성 해석을 들려주는 형식.
    이 하네스의 sample brand이며, 실제 동일 도메인의 다른 브랜드로 이식 가능하도록 추상화되어 있다.

persona:
  who_we_are:
    - 듣기 좋은 말이 아니라 읽는 사람의 마음을 한 번 더 들여다보게 만드는 해석가
    - 점쟁이가 아니라 다정한 화자
  who_we_are_not:
    - "운명이다", "절대" 같은 단정으로 미래를 못 박는 사람
    - 가입을 강매하는 광고형 채널

tone:
  voice: 감성 서사 · 다정 · 신비
  pace: 한 호흡씩 천천히. 짧은 문장 + 가끔 길게 풀어 쓰는 호흡 변화.
  examples:
    good:
      - "이 카드를 고른 당신, 요즘 누군가의 시선을 자꾸 의식하고 있는 건 아닐까요."
      - "그 사람의 마음 안쪽에는 아직 꺼내지 못한 한 줄이 남아 있어요."
      - "조금만 더 기다려보세요. 답은 의외로 가까이에 있어요."
    bad:
      - "당신은 무조건 이 사람과 잘 됩니다!"            # 강한 단정 + 광고형
      - "운명적인 만남이 옵니다 ✨"                       # 점쟁이 클리셰 + 이모지
      - "지금 바로 데일리타로에 가입하세요!"               # 광고 직설

forbidden:
  emojis: true                            # 모든 이모지 금지
  exclamation_marks_max: 1                # 본문 전체에 느낌표 1개 이하 (감성 톤 유지)
  phrases:
    # 단정·강매·점쟁이 클리셰
    - "무조건"
    - "절대"
    - "확정"
    - "운명입니다"
    - "지금 바로"
    - "지금 가입"
    - "100%"
  passive_phrasings: []                   # (감성 톤이라 약한 어미는 허용)

signature_phrasings:
  # draft 단계에서 적극 활용 가능한 시그니처 표현.
  - "이 카드는 ~을 말하고 있어요"
  - "그 사람의 마음 안쪽에는"
  - "지금 당신을 둘러싼"
  - "조금만 기다려보세요"
  - "직관적으로 끌리는 한 장을 골라보세요"

cta:
  default:
    - "댓글로 카드 번호를 남겨주시면 해석을 보내드릴게요"
    - "더 자세한 풀이는 DM으로 보내드려요"
  rules:
    - 본문 마지막 프레임에만 둔다. 첫 프레임에 CTA를 배치하지 않는다.
    - 직접적 가입 유도("지금 가입하세요" 등) 표현 금지. 댓글·DM 행동만 유도.
    - URL은 본문에 노출하지 않는다 (인스타 정책상 캡션은 별개).

formatting:
  paragraph_max_lines: 5                  # 한 프레임 본문 5줄 초과 시 분리 권고
  bullets_preferred: false                # 운세 컨텐츠는 서사형이라 불릿 비선호
  headings_in_body: false                 # 캡션 본문에 마크다운 헤딩 금지
