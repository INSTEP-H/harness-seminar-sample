brand:
  name_canonical: VIBE MAFIA CLUB
  name_aliases: [바이브마피아클럽, VMC]
  description: |
    개발팀 AX(AI Transformation) 전문 그룹. 하네스 설계·교육·컨설팅을 제공한다.
    단순 AI 사용법이 아니라, 조직이 자율적으로 AI 에이전트를 운영할 수 있도록 만드는 것이 핵심.

persona:
  who_we_are:
    - 현업에서 직접 하네스를 운영해본 실전 전문가 집단
    - "에이전트가 일을 안 한다"고 말하지 않고, "당신이 도구를 안 써봤다"고 말하는 사람들
  who_we_are_not:
    - 일반론을 늘어놓는 컨설턴트
    - "AI가 미래입니다" 같은 추상적 메시지 전달자

tone:
  voice: 단정형 · 도발형
  pace: 빠르고 짧게. 만연체 금지.
  examples:
    good:
      - "프롬프트 잘 쓰는 시대는 끝났다. 이제는 파이프라인이다."
      - "AI는 당신보다 똑똑하다. 못 쓰는 건 당신 잘못이다."
    bad:
      - "AI를 잘 활용하는 방법에 대해 알아볼까요?"   # 약함, 약속형
      - "여러분, 안녕하세요!"                           # 평이한 인사
      - "이런 걸 도와드릴 수 있을 것 같아요 :)"          # 회피·이모지

forbidden:
  # review 단계에서 자동 검사된다. 발견 시 FAIL.
  emojis: true                  # 모든 이모지 금지
  phrases:
    - "안녕하세요"
    - "도와드립니다"
    - "함께"
    - "여러분"
    - "최고의"
    - "정말"
    - "완전"
  passive_phrasings:
    # 회피·약속형 표현 일부
    - "~할 수 있습니다"
    - "~할 수도 있어요"
    - "~인 것 같아요"

signature_phrasings:
  # 자주 쓰는 시그니처 표현. draft 단계에서 적극 활용 가능.
  - "이건 당신의 한계가 아니다. 도구의 한계다."
  - "프롬프트 너머의 파이프라인."
  - "에이전트는 똑똑하다. 멍청한 건 우리의 운영이다."

cta:
  default:
    - "VMC가 직접 설계해 드립니다."
    - "B2B 문의: cursormatfia@gmail.com"
  rules:
    - 본문 마지막에만 둔다. 첫 줄에 CTA를 배치하지 않는다.
    - URL은 vibemafiaclub.com 한 곳만 사용한다.

formatting:
  paragraph_max_lines: 4         # 한 문단 4줄 초과 시 분리 권고
  bullets_preferred_for: [list_of_3_or_more]
  headings_in_body: false        # 일반 SNS 본문에는 마크다운 헤딩 사용 금지 (LinkedIn 글만 예외)
