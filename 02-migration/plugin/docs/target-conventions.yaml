general:
  - id: GEN-001
    rule: 함수는 단일 책임 원칙을 따른다. 50줄을 넘으면 분리를 검토한다.
    stacks: [all]
  - id: GEN-002
    rule: 매직 넘버를 사용하지 않는다. 상수로 선언한다.
    stacks: [all]
  - id: GEN-003
    rule: 에러 핸들링은 발생 지점에서 처리한다. 호출자에게 무조건 위임하지 않는다.
    stacks: [all]

typescript:
  - id: TS-001
    rule: any 타입 사용을 금지한다. 불가피한 경우 unknown을 사용하고 타입 가드를 작성한다.
    stacks: [typescript]
  - id: TS-002
    rule: 인터페이스 네이밍에 I 접두사를 사용하지 않는다.
    stacks: [typescript]
  - id: TS-003
    rule: enum 대신 as const 객체를 사용한다.
    stacks: [typescript]

nextjs:
  - id: NEXT-001
    rule: 서버 컴포넌트를 기본으로 사용한다. 클라이언트 컴포넌트는 "use client" 경계를 최소화한다.
    stacks: [next]
  - id: NEXT-002
    rule: API 호출은 서버 컴포넌트 또는 Server Action에서 수행한다. 클라이언트에서 직접 fetch하지 않는다.
    stacks: [next]
  - id: NEXT-003
    rule: 페이지 컴포넌트에 비즈니스 로직을 넣지 않는다. 별도 함수/훅으로 분리한다.
    stacks: [next]

migration:
  - id: MIG-001
    rule: 레거시 도메인 용어(주문/원장/계정 등)를 보존한다. 임의로 영어 이름을 변경하지 않는다.
    stacks: [all]
  - id: MIG-002
    rule: 레거시 화면과 동일하게 동작·시각 회귀를 통과해야 한다. 회귀 누락분은 implement 완료로 보지 않는다.
    stacks: [all]
  - id: MIG-003
    rule: migration-policy의 approach가 1to1이면 신규 컨벤션이 충돌해도 1to1 흐름을 우선한다.
    stacks: [all]
  - id: MIG-004
    rule: 레거시 API 응답에 존재하던 필드는 누락하지 않는다. 미사용으로 보이더라도 외부 계약일 수 있으므로 plan에 명시 후 사용자 승인 시에만 제거한다.
    stacks: [all]
